<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat com Salas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 400px;
      height: 650px;
      background: white;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .header {
      background: #4facfe;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .top-inputs {
      display: flex;
      gap: 5px;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    input {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      flex: 1;
    }

    button {
      padding: 8px;
      border: none;
      background: #4facfe;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      max-width: 75%;
    }

    .me {
      background: #4facfe;
      color: white;
      margin-left: auto;
    }

    .other {
      background: #eee;
    }

    .typing {
      font-size: 12px;
      color: #666;
      padding: 5px 10px;
    }

    .input-area {
      display: flex;
      gap: 5px;
      padding: 10px;
      border-top: 1px solid #eee;
    }

    .input-area input {
      flex: 1;
    }

    .input-area button {
      background: #00c9a7;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">💬 Chat</div>

  <div class="top-inputs">
    <input id="room" placeholder="Sala">
    <button onclick="joinRoom()">Entrar</button>
  </div>

  <div id="messages" class="messages"></div>
  <div id="typing" class="typing"></div>

  <div class="input-area">
    <input id="msg" placeholder="Mensagem" oninput="handleTyping()">
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
  const socket = io();

  let currentRoom = "";
  let typingTimeout;

  function joinRoom() {
    const room = document.getElementById("room").value;
    if (!room) return;

    currentRoom = room;
    socket.emit("joinRoom", room);

    document.getElementById("messages").innerHTML = "";
  }

  function sendMessage() {
    const input = document.getElementById("msg");
    const message = input.value;

    if (!message || !currentRoom) return;

    socket.emit("message", {
      room: currentRoom,
      message
    });

    input.value = "";
  }

  function addMessage(message, isMe) {
    const div = document.createElement("div");
    div.classList.add("message", isMe ? "me" : "other");

    div.textContent = message;

    const messages = document.getElementById("messages");
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  // 👇 DIGITANDO
  function handleTyping() {
    socket.emit("typing");

    clearTimeout(typingTimeout);

    typingTimeout = setTimeout(() => {
      document.getElementById("typing").textContent = "";
    }, 1000);
  }

  socket.on("typing", () => {
    const typingDiv = document.getElementById("typing");
    typingDiv.textContent = "Alguém está digitando...";

    setTimeout(() => {
      typingDiv.textContent = "";
    }, 1000);
  });

  socket.on("message", (data) => {
    const isMe = data.user === socket.id;
    addMessage(data.message, isMe);
  });
</script>

</body>
</html>
