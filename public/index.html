<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat com Salas</title>

  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .chat-container {
    width: 420px;
    height: 700px;
    background: #ffffff;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #4facfe, #00c6ff);
    color: white;
    padding: 18px;
    text-align: center;
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 1px;
  }

  .top-inputs {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #f5f7fa;
    border-bottom: 1px solid #eee;
  }

  input {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
    flex: 1;
    outline: none;
    transition: 0.2s;
  }

  input:focus {
    border-color: #4facfe;
    box-shadow: 0 0 5px rgba(79,172,254,0.5);
  }

  button {
    padding: 10px 14px;
    border: none;
    background: linear-gradient(135deg, #4facfe, #00c6ff);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    font-weight: bold;
  }

  button:hover {
    transform: scale(1.05);
    opacity: 0.9;
  }

  .messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #e5ddd5;
    display: flex;
    flex-direction: column;
  }

  .message {
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 12px;
    max-width: 75%;
    font-size: 14px;
    line-height: 1.4;
    animation: fadeIn 0.2s ease;
  }

  .me {
    background: #4facfe;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 2px;
  }

  .other {
    background: #ffffff;
    border: 1px solid #ddd;
    border-bottom-left-radius: 2px;
  }

  .input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #f5f7fa;
    border-top: 1px solid #eee;
  }

  .input-area input {
    flex: 1;
  }

  .input-area button {
    background: linear-gradient(135deg, #00c9a7, #00e4a7);
  }

  .messages::-webkit-scrollbar {
    width: 6px;
  }

  .messages::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="header">💬 Chat</div>

  <div class="top-inputs">
    <input id="room" placeholder="Sala">
    <button onclick="joinRoom()">Entrar</button>
  </div>

  <div id="messages" class="messages"></div>

  <div class="input-area">
    <input id="msg" placeholder="Mensagem">
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
  const socket = io();

  let currentRoom = "";

  function joinRoom() {
    const room = document.getElementById("room").value;
    if (!room) return;

    currentRoom = room;
    socket.emit("joinRoom", room);

    document.getElementById("messages").innerHTML = "";
  }

  function sendMessage() {
    const input = document.getElementById("msg");
    const message = input.value;

    if (!message || !currentRoom) return;

    socket.emit("message", {
      room: currentRoom,
      message
    });

    input.value = "";
  }

  function addMessage(message, isMe) {
    const div = document.createElement("div");
    div.classList.add("message", isMe ? "me" : "other");

    div.textContent = message;

    const messages = document.getElementById("messages");
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  socket.on("message", (data) => {
    const isMe = data.user === socket.id;
    addMessage(data.message, isMe);
  });
</script>

</body>
</html>
